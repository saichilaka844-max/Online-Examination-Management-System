
spring.application.name=online-exam

server.port=8080

# -----------------------------------------------
# DataSource - credentials should be overridden via
# environment variables in production:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# -----------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/online_exam_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Moksha@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------
# JPA / Hibernate
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------
# Thymeleaf
# -----------------------------------------------
spring.thymeleaf.cache=false

# -----------------------------------------------
# Initial admin account configuration
# Set these via environment variables or a .env file - never hard-code real passwords here.
# Example: APP_ADMIN_USERNAME=admin APP_ADMIN_PASSWORD=changeme
# -----------------------------------------------
app.admin.username=${APP_ADMIN_USERNAME:admin}
# DEV ONLY default – override with APP_ADMIN_PASSWORD env variable in production
app.admin.password=${APP_ADMIN_PASSWORD:Admin@1234}

# -----------------------------------------------
# Logging
# -----------------------------------------------
logging.level.com.example.online_exam=DEBUG
logging.level.org.springframework.security=INFO
