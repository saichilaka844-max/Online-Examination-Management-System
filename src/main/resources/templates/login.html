<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login – Online Exam System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-layout">
<div class="auth-card">
    <div class="auth-header">
        <h1>Online Exam System</h1>
        <p>Sign in to your account</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert-info">
        You have been logged out.
    </div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control"
                   placeholder="Enter username" required/>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Enter password" required/>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">Login</button>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Don't have a student account? <a th:href="@{/register}">Register here</a>
        </p>
    </form>
</div>
</body>
</html>
