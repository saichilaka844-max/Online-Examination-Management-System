<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            ⚙️ Admin Portal
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/users}" class="active">Users</a>
            <a th:href="@{/admin/subjects}">Subjects</a>
            <a th:href="@{/admin/questions}">Questions</a>
            <a th:href="@{/admin/exams}">Exams</a>
            <a th:href="@{/admin/results}">Student Results</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>Manage Users</div>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
            </form>
        </header>

        <div class="content-area">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <!-- Create User Form -->
            <div class="card" style="margin-bottom: 2rem;">
                <div class="card-header">
                    <h3>Create New User</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/users/create}" method="post" th:object="${registrationDto}">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" th:field="*{username}" class="form-control" required/>
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" th:field="*{password}" class="form-control" required/>
                            </div>
                            <div class="form-group">
                                <label>Role</label>
                                <select th:field="*{role}" class="form-control">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                                </select>
                            </div>
                        </div>
                        <h4 style="margin: 1.5rem 0 1rem;">Student Profile <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">(fill only if role = STUDENT)</span></h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Student ID</label>
                                <input type="text" th:field="*{studentId}" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" th:field="*{fullName}" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label>Department</label>
                                <input type="text" th:field="*{department}" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" th:field="*{email}" class="form-control"/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Create User</button>
                    </form>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card">
                <div class="card-header">
                    <h3>All Users</h3>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr><th>ID</th><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.username}"></td>
                            <td><span class="badge badge-info" th:text="${u.role}"></span></td>
                            <td>
                                <span th:class="${u.enabled} ? 'badge badge-success' : 'badge badge-danger'"
                                      th:text="${u.enabled} ? 'Active' : 'Disabled'"></span>
                            </td>
                            <td>
                                <a th:href="@{/admin/users/{id}(id=${u.id})}" class="btn btn-sm btn-info">View</a>
                                <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline">
                                    <button type="submit" class="btn btn-sm btn-warning"
                                            th:text="${u.enabled} ? 'Disable' : 'Enable'"></button>
                                </form>
                                <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" style="display:inline"
                                      onsubmit="return confirm('Delete this user?')">
                                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
    $(document).ready(function() {
        $('.table').DataTable();
    });
</script>
</body>
</html>
