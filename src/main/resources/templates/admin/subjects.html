<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Subjects</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            ⚙️ Admin Portal
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/users}">Users</a>
            <a th:href="@{/admin/subjects}" class="active">Subjects</a>
            <a th:href="@{/admin/questions}">Questions</a>
            <a th:href="@{/admin/exams}">Exams</a>
            <a th:href="@{/admin/results}">Student Results</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>Manage Subjects</div>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
            </form>
        </header>

        <div class="content-area">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card" style="margin-bottom: 2rem;">
                <div class="card-header">
                    <h3>Add New Subject</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/subjects/create}" method="post">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" class="form-control" required/>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Subject</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>All Subjects</h3>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
                        <tbody>
                        <tr th:each="s : ${subjects}">
                            <td th:text="${s.id}"></td>
                            <td th:text="${s.name}"></td>
                            <td th:text="${s.description}"></td>
                            <td>
                                <a th:href="@{/admin/subjects/{id}/edit(id=${s.id})}" class="btn btn-sm btn-warning">Edit</a>
                                <form th:action="@{/admin/subjects/{id}/delete(id=${s.id})}" method="post" style="display:inline"
                                      onsubmit="return confirm('Delete this subject?')">
                                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
    $(document).ready(function() {
        $('.table').DataTable();
    });
</script>
</body>
</html>
