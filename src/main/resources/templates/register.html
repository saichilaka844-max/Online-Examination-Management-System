<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register – Online Exam System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-layout">
<div class="auth-card" style="max-width: 500px;">
    <div class="auth-header">
        <h1>Online Exam System</h1>
        <p>Student Registration</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" method="post" th:object="${registrationDto}">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Choose a username" required/>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Create a password" required/>
        </div>
        <div class="form-group">
            <label for="studentId" class="form-label">Student ID</label>
            <input type="text" id="studentId" th:field="*{studentId}" class="form-control" placeholder="e.g. S12345" required/>
        </div>
        <div class="form-group">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="First and Last Name" required/>
        </div>
        <div class="form-group">
            <label for="department" class="form-label">Department</label>
            <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="e.g. Computer Science" required/>
        </div>
        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="student@example.com" required/>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">Register</button>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a th:href="@{/login}">Login here</a>
        </p>
    </form>
</div>
</body>
</html>
